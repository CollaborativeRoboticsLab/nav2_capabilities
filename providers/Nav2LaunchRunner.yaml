# the base provider
%YAML 1.1
---
name: Nav2LaunchRunner
spec_type: provider
spec_version: 1.2
description: "The provider that launches the Nav2 stack used by navigation-related capabilities."
implements: nav2_capabilities/Nav2LaunchRunner
runner: nav2_capabilities/nav2.launch.py
definition:
  launch_parameters:
    - key: use_sim_time
      value: "False"
    - key: autostart
      value: "True"
    - key: use_localization
      value: "True"
    - key: use_composition
      value: "True"
  launch_readiness:
    lifecycle:
      nodes: [planner_server, bt_navigator]
      timeout_sec: 60.0
    action:
      name: navigate_to_pose
      type: nav2_msgs/action/NavigateToPose
      timeout: 60.0
