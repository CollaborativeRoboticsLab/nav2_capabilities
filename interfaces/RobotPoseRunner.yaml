%YAML 1.1
---
name: RobotPoseRunner
spec_version: 1.1
spec_type: interface
description: "This capability depends on the navigation stack functionalities and allows the extraction of the pose of the robot from TF transforms.
              It first attempts to resolve the transform from map to the robot frame and falls back to odom to robot if needed. This extracted
              robot pose can be used by the decision making authority to understand the position and orientation of the robot. This capability can
              be triggered with an xml command such as '<Runner interface=nav2_capabilities/RobotPoseRunner provider=nav2_capabilities/RobotPoseRunner map='map' odom='odom' robot='base_link' time_buffer='5.0'/>'.
              Upon successful execution, another capability that allows robot pose prompting needs to be triggered for transfer of robot pose data
              to the decision making authority for future decision making. '<Runner interface=prompt_capabilities/PromptPoseRunner provider=prompt_capabilities/PromptPoseRunner />'
              can be used as a robot pose prompting capability for this."
interface:
  topics:
    "/tf":
      type: "tf2_msgs/msg/TFMessage"
      description: "TF transform stream used to resolve the robot pose from map->robot or odom->robot transforms"