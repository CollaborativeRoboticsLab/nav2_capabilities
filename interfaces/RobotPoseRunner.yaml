%YAML 1.1
---
name: RobotPoseRunner
spec_version: 1.2
spec_type: interface
description: "This capability depends on the navigation stack functionalities and allows the extraction of 
              the pose of the robot from TF transforms. It first attempts to resolve the transform from map 
              to the robot frame and falls back to odom to robot if needed. This extracted  robot pose can 
              be used by a planning entity to understand the position and orientation of the robot."