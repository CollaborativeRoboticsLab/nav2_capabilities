%YAML 1.1
---
name: WaypointRunner
spec_version: 1.2
spec_type: interface
description: "This capability depends on the navigation stack and allows the robot to navigate to
              a target pose expressed in the map frame. The request expects `x` and `y` position
              values, while `z`, `qx`, `qy`, `qz`, and `qw` may be omitted to use the runner
              defaults for a planar pose."
interface:
  actions:
    "/navigate_to_pose":
      type: "nav2_msgs::action::NavigateToPose"
      description: "Waypoint follower interface of the Nav2 stack"